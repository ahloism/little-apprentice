    A33: 'image/A33_阿水——期待解鎖 eager .png'
  };

  // --- 狀態 ---
  const asuiState = {
    queue: [],
    isPlaying: false,
    currentDialogue: null,
    currentLineIndex: 0,
    tapRotateIndex: {},
    lastGameResult: null
  };

  let asuiDialogues = null;
  let asuiManifest = null;
  let asuiPresentation = null;

  // --- 初始化 ---
  async function initAsui() {
    try {
      asuiDialogues = globalData.asui_dialogues || await loadJSON('json/asui_dialogues.json');
      asuiManifest = globalData.asui_manifest || await loadJSON('json/asui_manifest.json');
      asuiPresentation = globalData.asui_presentation || await loadJSON('json/asui_presentation.json');
      setAsuiCharacter('A27');
      document.getElementById('asui-character').addEventListener('click', onAsuiCharacterTap);
      document.getElementById('asui-dialogue').addEventListener('click', onDialogueTap);
    } catch (e) {
      logError(e.message, 'initAsui', state.uid);
    }
  }

  // --- 角色圖管理 ---
  function setAsuiCharacter(stateId) {
    const el = document.getElementById('asui-character');
    if (!el) return;
    const img = new Image();
    img.src = BASE_PATH + (ASUI_IMAGES[stateId] || ASUI_IMAGES.A27);
    img.onload = () => {
      el.innerHTML = '';
      const canvas = document.createElement('canvas');
      canvas.width = img.naturalWidth;
      canvas.height = img.naturalHeight;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0);
      el._imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
      el.appendChild(canvas);
    };
  }

  function isAsuiPixelTransparent(e) {
    const el = document.getElementById('asui-character');
    if (!el._imageData) return false;
    const canvas = el.querySelector('canvas');
    if (!canvas) return true;
    const rect = canvas.getBoundingClientRect();
    const scaleX = canvas.width / rect.width;
    const scaleY = canvas.height / rect.height;
    const px = Math.floor((e.clientX - rect.left) * scaleX);
    const py = Math.floor((e.clientY - rect.top) * scaleY);
    if (px < 0 || py < 0 || px >= canvas.width || py >= canvas.height) return true;
    const index = (py * canvas.width + px) * 4;
    return el._imageData.data[index + 3] < 10;
  }

  // --- Tap對白觸發 ---
  function onAsuiCharacterTap(e) {
    if (asuiState.isPlaying) return;
    if (isAsuiPixelTransparent(e)) return;
    const playerState = getAsuiPlayerState();
    const rule = getAsuiTapRule(playerState);
    if (!rule) return;
    const ids = rule.dialogue_ids || [rule.dialogue_id].filter(Boolean);
    const key = rule.rule_id;
    if (!ids.length) return;
    if (asuiState.tapRotateIndex[key] === undefined) asuiState.tapRotateIndex[key] = 0;
    const idx = asuiState.tapRotateIndex[key] % ids.length;
    asuiState.tapRotateIndex[key]++;
    playAsuiDialogue(ids[idx]);
  }

  function getAsuiTapRule(playerState) {
    const conditionMap = {
      main_incomplete_no_unlock: 'main_story_incomplete',
      main_incomplete_unlock_available: 'unlock_available_coins_sufficient',
      main_complete_unlock_available: 'unlock_available_coins_sufficient',
      main_complete_all_unlocked: 'all_unlocked_story_incomplete',
      map_all_colored: 'all_colored_story_complete'
    };
    const condition = conditionMap[playerState];
    return asuiManifest?.rules?.find(r => r.trigger_type === 'tap_asui' && r.trigger_condition === condition);
  }

  // --- Queue管理 ---
  function buildAsuiQueue(room) {
    const fired = getFiredAsuiDialogues();
    const rules = (asuiManifest?.rules || [])
      .filter(r => r.trigger_type === 'auto' && r.room === room && (r.priority || 0) < 99)
      .filter(r => {
        if (!r.repeat && fired.includes(r.dialogue_id)) return false;
        return checkAsuiTriggerCondition(r.trigger_condition);
      })
      .sort((a, b) => (a.priority || 0) - (b.priority || 0));
    asuiState.queue = rules.map(r => r.dialogue_id);
  }

  function checkAsuiTriggerCondition(condition) {
    const progress = state;
    const fired = getFiredAsuiDialogues();
    switch (condition) {
      case 'first_map_entry':
        return !fired.includes('A1');
      case 'first_location_appear':
        return !fired.includes('A2') && (progress.completed_events?.length >= 1);
      case 'first_coins_earned':
        return !fired.includes('A3') && progress.coins > 0 && (progress.completed_events?.length >= 1);
      case 'first_unlock_available':
        return !fired.includes('A4') && asuiHasUnlockableLocation();
      case 'after_event_1_1':
        return asuiEventCompleted('1_1') && !fired.includes('A6');
      case 'after_event_1_2':
        return asuiEventCompleted('1_2') && !fired.includes('A7');
      case 'after_event_1_3':
        return asuiEventCompleted('1_3') && !fired.includes('A8');
      case 'after_event_1_4_choice_A':
        return getAsuiAssessmentChoice('1_4_2') === 'A' && !fired.includes('A9');
      case 'after_event_1_4_choice_B':
        return getAsuiAssessmentChoice('1_4_2') === 'B' && !fired.includes('A10');
      case 'after_event_1_4_choice_C':
        return getAsuiAssessmentChoice('1_4_2') === 'C' && !fired.includes('A11');
      case 'after_event_1_5':
        return asuiEventCompleted('1_5') && !fired.includes('A12');
      case 'after_event_1_6':
        return asuiEventCompleted('1_6') && !fired.includes('A13');
      case 'after_event_1_7':
        return asuiEventCompleted('1_7') && !fired.includes('A14');
      case 'map_colored_gte_4':
        return asuiMapColoredCount() >= 4 && !fired.includes('A15');
      case 'map_all_colored':
        return asuiMapColoredCount() >= 5 && !fired.includes('A16');
      case 'minigame_first_correct':
        return asuiState.lastGameResult === 'correct_first';
      case 'minigame_replay_correct':
        return asuiState.lastGameResult === 'correct_replay';
      case 'minigame_first_wrong':
        return asuiState.lastGameResult === 'wrong_first';
      case 'minigame_replay_wrong':
        return asuiState.lastGameResult === 'wrong_replay';
      default:
        return false;
    }
  }

  function processAsuiQueue(room) {
    buildAsuiQueue(room);
    if (asuiState.queue.length > 0) {
      playNextAsuiInQueue();
    } else {
      playAsuiFallback(room);
    }
  }

  function playNextAsuiInQueue() {
    if (asuiState.queue.length === 0) {
      asuiState.isPlaying = false;
      setAsuiCharacter('A27');
      return;
    }
    const id = asuiState.queue.shift();
    playAsuiDialogue(id);
  }

  // --- 對白播放 ---
  function playAsuiDialogue(dialogueId) {
    const dialogue = asuiDialogues?.dialogues?.find(d => d.id === dialogueId);
    if (!dialogue) return;
    asuiState.isPlaying = true;
    asuiState.currentDialogue = { ...dialogue };
    asuiState.currentLineIndex = 0;
    setAsuiCharacter(dialogue.visual_state || 'A27');
    const text = dialogue.lines ? dialogue.lines[0] : (dialogue._resolvedText || dialogue.text || '');
    showAsuiDialogueBar(text, dialogue);
    const audio = getAsuiAudioForDialogue(dialogueId, 0);
    if (audio) playAsuiTTS(audio, text);
    markAsuiDialogueFired(dialogueId);
  }

  function showAsuiDialogueBar(text, dialogue) {
    const bar = document.getElementById('asui-dialogue');
    bar.querySelector('.asui-text').textContent = text;
    bar.querySelector('.asui-buttons').innerHTML = '';
    const override = asuiPresentation?.overrides?.find(o => o.applies_to?.includes(dialogue.id));
    if (override?.confirm_buttons || dialogue.confirm_buttons) {
      renderAsuiButtons(override?.confirm_buttons || dialogue.confirm_buttons, dialogue.id);
    }
    bar.classList.remove('hidden');
    requestAnimationFrame(() => bar.classList.add('visible'));
  }

  function hideAsuiDialogueBar() {
    const bar = document.getElementById('asui-dialogue');
    bar.classList.remove('visible');
    setTimeout(() => {
      bar.classList.add('hidden');
      bar.querySelector('.asui-text').textContent = '';
      bar.querySelector('.asui-buttons').innerHTML = '';
      setAsuiCharacter('A27');
    }, 300);
  }

  function onDialogueTap() {
    const dialogue = asuiState.currentDialogue;
    if (!dialogue) return;
    if (document.querySelector('.asui-buttons').children.length > 0) return;
    if (_ttsAudio && !_ttsAudio.paused) return;

    if (dialogue.lines) {
      asuiState.currentLineIndex++;
      if (asuiState.currentLineIndex >= dialogue.lines.length) {
        hideAsuiDialogueBar();
        playNextAsuiInQueue();
        return;
      }
      const text = dialogue.lines[asuiState.currentLineIndex];
      document.querySelector('.asui-text').textContent = text;
      const audio = getAsuiAudioForDialogue(dialogue.id, asuiState.currentLineIndex);
      if (audio) playAsuiTTS(audio, text);
      return;
    }

    if (dialogue.id === 'return_to_map_normal' && asuiState.currentLineIndex === 0) {
      asuiState.currentLineIndex = 1;
      const playerState = getAsuiPlayerState();
      const suggestion = getAsuiStateSuggestion(playerState);
      document.querySelector('.asui-text').textContent = suggestion;
      if (playerState === 'main_incomplete_unlock_available') {
        renderAsuiButtons({ unlock: '解鎖', continue: '繼續冒險' }, 'return_to_map_normal');
      }
      const assets = asuiPresentation?.dialogue_assets?.return_to_map_normal;
      if (assets?.audio?.line_2?.[playerState]) {
        playAsuiTTS(assets.audio.line_2[playerState], suggestion);
      }
      return;
    }

    hideAsuiDialogueBar();
    asuiState.isPlaying = false;
    playNextAsuiInQueue();
  }

  // --- 動態對白 ---
  function getAsuiStateSuggestion(playerState) {
    const map = {
      main_incomplete_no_unlock: '下一站還沒去——繼續冒險吧！',
      main_incomplete_unlock_available: '有地方可以解鎖！要解鎖嗎？',
      main_complete_unlock_available: '故事走完了！還有小任務等著你。',
      main_complete_all_unlocked: '都解鎖了！去大梁城四處探索看看。',
      map_all_colored: '大梁城每個角落都去過了！繼續在城裡探索吧。'
    };
    return map[playerState] || '';
  }

  function resolveReturnReloadText() {
    const completed = state.completed_events || [];
    const last = completed[completed.length - 1];
    if (!last) return '上次完成了一個地方，要繼續嗎？還是先回顧一下？';
    const normalized = String(last).replace(/^story_/, '');
    const titleMap = {
      '1_1': '商行取貨', '1_2': '市集風波',
      '1_3': '橋邊問路', '1_4': '尋找老梁',
      '1_5': '客棧聽書', '1_6': '碼頭風波',
      '1_7': '帳房考驗'
    };
    const title = titleMap[normalized] || titleMap[last] || last;
    return `上次完成了${title}，要繼續嗎？還是先回顧一下？`;
  }

  // --- 兜底對白 ---
  function playAsuiFallback(room) {
    if (room !== 'map') return;
    const isReload = sessionStorage.getItem('asui_is_reload') === 'true';
    sessionStorage.removeItem('asui_is_reload');
    if (isReload && (state.completed_events?.length > 0)) {
      const dialogue = asuiDialogues?.dialogues?.find(d => d.id === 'return_to_map_reload');
      if (dialogue) {
        dialogue._resolvedText = resolveReturnReloadText();
        playAsuiDialogue('return_to_map_reload');
      }
    } else {
      playAsuiDialogue('return_to_map_normal');
    }
  }

  // --- 地點解鎖確認（R1-R6）---
  function triggerAsuiLocationDialogue(locationId) {
    asuiState.queue = [];
    const costMap = { warehouse: 15, market: 20, bridge: 25, inn: 20, dock: 25 };
    const dialogueMap = { warehouse: 'R1', market: 'R2', bridge: 'R3', inn: 'R4', dock: 'R5' };
    const cost = costMap[locationId];
    const coins = state.coins || 0;
    if (cost && coins < cost) {
      playAsuiDialogue('R6');
      return;
    }
    const id = dialogueMap[locationId];
    if (id) playAsuiDialogue(id);
  }

  // --- 按鈕渲染 ---
  function renderAsuiButtons(buttons, dialogueId) {
    const btnsEl = document.querySelector('.asui-buttons');
    btnsEl.innerHTML = '';
    Object.entries(buttons).forEach(([key, label]) => {
      const btn = document.createElement('button');
      btn.className = 'asui-btn';
      btn.textContent = label;
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        onAsuiButtonClick(key, dialogueId);
      });
      btnsEl.appendChild(btn);
    });
  }

  function onAsuiButtonClick(action, dialogueId) {
    hideAsuiDialogueBar();
    asuiState.isPlaying = false;
    asuiState.queue = [];
    setAsuiCharacter('A27');
    if (dialogueId === 'return_to_map_reload') {
      if (action === 'review') openProgressPanel();
      else if (action === 'continue') { /* 繼續主線，地圖房處理 */ }
    } else if (dialogueId === 'return_to_map_normal') {
      if (action === 'unlock') { /* 箭嘴指向可解鎖地點，地圖房實作 */ }
      else if (action === 'continue') { /* 箭嘴指向下一主線地點，地圖房實作 */ }
    } else if (['R1','R2','R3','R4','R5'].includes(dialogueId)) {
      if (action === 'confirm') { /* 執行解鎖，地圖房實作 */ }
    }
  }

  // --- Story房觸發 ---
  function triggerAsuiInStory(condition) {
    const rule = asuiManifest?.rules?.find(r => r.trigger_condition === condition);
    if (!rule) return;
    const fired = getFiredAsuiDialogues();
    if (!rule.repeat && fired.includes(rule.dialogue_id)) return;
    playAsuiDialogue(rule.dialogue_id);
  }

  // --- 玩家狀態判斷 ---
  function getAsuiPlayerState() {
    const completed = state.completed_events || [];
    const unlocked = state.unlocked_games || [];
    const allEventsComplete = completed.length >= 7;
    const hasUnlockable = asuiHasUnlockableLocation();
    const allUnlocked = ['game_1_warehouse','game_1_market','game_1_bridge','game_1_inn','game_1_dock']
      .every(g => unlocked.includes(g));
    if (asuiMapColoredCount() >= 5) return 'map_all_colored';
    if (allEventsComplete && allUnlocked) return 'main_complete_all_unlocked';
    if (allEventsComplete && hasUnlockable) return 'main_complete_unlock_available';
    if (!allEventsComplete && hasUnlockable) return 'main_incomplete_unlock_available';
    return 'main_incomplete_no_unlock';
  }

  function asuiHasUnlockableLocation() {
    const completed = state.completed_events || [];
    const unlocked = state.unlocked_games || [];
    const coins = state.coins || 0;
    const gameMap = {
      '1_1': { game: 'game_1_warehouse', cost: 15 },
      '1_2': { game: 'game_1_market', cost: 20 },
      '1_3': { game: 'game_1_bridge', cost: 25 },
      '1_5': { game: 'game_1_inn', cost: 20 },
      '1_6': { game: 'game_1_dock', cost: 25 }
    };
    return completed.some(e => {
      const entry = gameMap[String(e).replace(/^story_/, '')];
      return entry && !unlocked.includes(entry.game) && coins >= entry.cost;
    });
  }

  function asuiEventCompleted(eventId) {
    const completed = state.completed_events || [];
    return completed.includes(eventId) || completed.includes(`story_${eventId}`);
  }

  function asuiMapColoredCount() {
    const colored = state.map_colored || [];
    return Array.isArray(colored) ? colored.length : Number(colored || 0);
  }

  // --- 已播記錄 ---
  function getFiredAsuiDialogues() {
    try {
      return JSON.parse(localStorage.getItem('asui_fired') || '[]');
    } catch { return []; }
  }

  function markAsuiDialogueFired(id) {
    const fired = getFiredAsuiDialogues();
    if (!fired.includes(id)) {
      fired.push(id);
      localStorage.setItem('asui_fired', JSON.stringify(fired));
    }
  }

  function getAsuiAssessmentChoice(sceneId) {
    const node = (state.assessment_nodes || []).find(n => n.sceneId === sceneId);
    return node?.label || null;
  }

  // --- TTS ---
  function getAsuiAudioForDialogue(dialogueId, lineIndex = 0) {
    const assets = asuiPresentation?.dialogue_assets?.[dialogueId];
    if (!assets?.audio) return null;
    if (Array.isArray(assets.audio)) {
      if (dialogueId === 'return_to_map_reload') {
        const last = (state.completed_events || []).at(-1);
        const normalized = String(last || '').replace(/^story_/, '');
        const idxMap = { '1_1': 1, '1_2': 2, '1_3': 3, '1_4': 4, '1_5': 5, '1_6': 6, '1_7': 7 };
        return assets.audio[idxMap[normalized] || 0];
      }
      return assets.audio[lineIndex] || assets.audio[0];
    }
    if (typeof assets.audio === 'object') {
      if (lineIndex === 0) return assets.audio.line_1;
      const playerState = getAsuiPlayerState();
      return assets.audio.line_2?.[playerState] || null;
    }
    return assets.audio;
  }

  function playAsuiTTS(audioPath, text) {
    if (typeof playTTS === 'function' && audioPath) {
      _lockMapPins(true);
      playTTS(audioPath, {
        textElement: document.querySelector('.asui-text'),
        lockUI: false,
        onEnd: () => _lockMapPins(false)
      });
    }
  }

  function _lockMapPins(lock) {
    const pins = document.getElementById('map-pins');
    if (pins) pins.style.pointerEvents = lock ? 'none' : '';
  }

  // --- 對外介面 ---
  function onEnterMap() { processAsuiQueue('map'); }
  function onEnterMinigame() { processAsuiQueue('minigame'); }
  function onGameComplete(result) { asuiState.lastGameResult = result; }
  function onLocationTap(locationId) { triggerAsuiLocationDialogue(locationId); }
  function onStoryAsuiTrigger(condition) { triggerAsuiInStory(condition); }

  window.initAsui = initAsui;
  window.onEnterMap = onEnterMap;
  window.onEnterMinigame = onEnterMinigame;
  window.onGameComplete = onGameComplete;
  window.onLocationTap = onLocationTap;
  window.onStoryAsuiTrigger = onStoryAsuiTrigger;

  // ========== /模塊：阿水層 ==========

  // ========== 模塊：小遊戲房 ==========
  // 規格依據：小遊戲房共用規格文件.md + 五份小遊戲房規格文件

  const GAME_LOCATION_BY_ID = {
    game_1_warehouse: 'warehouse',
    game_1_market: 'market',
    game_1_bridge: 'bridge',
    game_1_inn: 'inn',
    game_1_dock: 'dock',
    warehouse: 'warehouse',
    market: 'market',
    bridge: 'bridge',
    inn: 'inn',
    dock: 'dock',
  };

  const GAME_ENTRY_IMAGES = {
    warehouse: 'image/S02_商行門口.png',
    market: 'image/S04_市集街道.png',
    bridge: 'image/S07_梁河橋邊.png',
    inn: 'image/S14_客棧內部.png',
    dock: 'image/S16_碼頭.png',
  };

  const _gamePlayedVariations = {};
  const gameState = {
    gameId: null,
    location: null,
    variationId: null,
    contentVariation: null,
    manifestVariation: null,
    evaluationVariation: null,
    presentationVariation: null,
    selectedOptionId: null,
    selectedComboId: null,
    isCorrect: false,
  };

  async function enterGame(gameId) {
    const location = _gameLocationFromId(gameId);
    if (!location) {
      logError('Unknown gameId', gameId, state.uid);
      return;
    }
    showRoom('game-house');
    handleRoomTransition('game');
    await loadGameData(location);
    gameState.gameId = gameData.content?.game_id || gameId;
    gameState.location = location;
    gameState.variationId = pickVariation(gameState.gameId);
    _bindGameVariation(gameState.variationId);
    renderGameScreen('intro');
  }

  function _gameLocationFromId(gameId) {
    return GAME_LOCATION_BY_ID[gameId] || null;
  }

  function pickVariation(gameId) {
    const variations = gameData.manifest?.variations || [];
    if (!variations.length) return null;
    if (!_gamePlayedVariations[gameId]) _gamePlayedVariations[gameId] = [];
    let remaining = variations.filter(v => !_gamePlayedVariations[gameId].includes(v.variation_id));
    if (!remaining.length) {
      _gamePlayedVariations[gameId] = [];
      remaining = variations;
    }
    const chosen = remaining[Math.floor(Math.random() * remaining.length)];
    _gamePlayedVariations[gameId].push(chosen.variation_id);
    return chosen.variation_id;
  }

  function _bindGameVariation(variationId) {
    gameState.contentVariation = (gameData.content?.variations || []).find(v => v.variation_id === variationId);
    gameState.manifestVariation = (gameData.manifest?.variations || []).find(v => v.variation_id === variationId);
    gameState.evaluationVariation = (gameData.evaluation?.variations || []).find(v => v.variation_id === variationId);
    gameState.presentationVariation = (gameData.presentation?.variations || []).find(v => v.variation_id === variationId);
    gameState.selectedOptionId = null;
    gameState.selectedComboId = null;
    gameState.isCorrect = false;
  }

  function renderGameScreen(screen) {
    if (screen === 'intro') return renderGameIntro();
    if (screen === 'vocab') return renderGameVocab();
    if (screen === 'answer') return renderGameAnswer();
    if (screen === 'feedback') return renderGameFeedback();
  }

  function _setGamePages(leftHTML, rightHTML) {
    document.getElementById('page-left').innerHTML = `<div class="game-page game-page-left">${leftHTML}</div>`;
    document.getElementById('page-right').innerHTML = `<div class="game-page game-page-right">${rightHTML}</div>`;
  }

  function _assetPath(path, base = IMAGE_BASE) {
    if (!path) return '';
    if (/^(https?:|data:)/.test(path)) return path;
    if (path.startsWith('../')) return path;
    if (path.startsWith('image/') || path.startsWith('audio/')) return BASE_PATH + path;
    return BASE_PATH + base + path;
  }

  function _ttsFilename(path) {
    if (!path) return '';
    return String(path).replace('../', '').replace('audio/tts/', '');
  }

  async function _playGameTTS(path, options = {}) {
    if (!state.tts_on || !path) return;
    await playTTS(_ttsFilename(path), options);
  }

  async function _playGameTTSSequence(paths) {
    if (!state.tts_on) return;
    for (const path of paths.filter(Boolean)) {
      await _playGameTTS(path);
    }
  }

  function _button(id, text, extraClass = '') {
    return `<button id="${id}" class="game-action-btn ${extraClass} hidden">${_escape(text)}</button>`;
  }

  function _escape(value) {
    return String(value ?? '').replace(/[&<>"']/g, ch => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[ch]));
  }

  function _randomFrom(list) {
    if (!Array.isArray(list)) return list;
    return list[Math.floor(Math.random() * list.length)];
  }

  async function renderGameIntro() {
    const entry = gameData.content?.entry_page || {};
    const introImage = GAME_ENTRY_IMAGES[gameState.location] || GAME_ENTRY_IMAGES.warehouse;
    _setGamePages(
      `<img class="game-image-main" src="${_assetPath(introImage)}" alt="">`,
      `<div><div class="game-title">${_escape(entry.title || gameData.content?.game_name || '')}</div><div id="game-intro-text-mounted" class="game-text">${_escape(entry.intro_text || '')}</div></div>${_button('game-intro-btn-mounted', '繼續')}`
    );
    const btn = document.getElementById('game-intro-btn-mounted');
    btn.onclick = () => renderGameScreen('vocab');
    const entryAudio = _entryAudioForGame();
    await _playGameTTS(entryAudio, { textElement: document.getElementById('game-intro-text-mounted') });
    btn.classList.remove('hidden');
  }

  function _entryAudioForGame() {
    return `entry_${gameState.gameId}.mp3`;
  }

  async function renderGameVocab() {
    const variation = gameState.contentVariation;
    const vocabIds = variation?.vocabulary_intro_ids || [];
    const rightCards = vocabIds.map((id, idx) => {
      const vocab = gameData.content.vocabulary_bank?.[id] || {};
      return `
        <div class="game-vocab-text-card" id="vocab-card-${idx}" style="margin-bottom:16px;padding:12px 0;border-bottom:1px solid rgba(90,58,16,0.1);">
          <div style="font-family:var(--serif);font-size:22px;font-weight:700;color:var(--ink);margin-bottom:6px;">${_escape(vocab.word || '')}</div>
          <div style="font-family:var(--hei);font-size:16px;color:var(--ink-soft);line-height:1.6;">${_escape(vocab.intro_text || vocab.description || '')}</div>
        </div>`;
    }).join('');

    const firstAsset = gameData.presentation.vocabulary_assets?.[vocabIds[0]] || {};
    const firstImage = firstAsset.image
      ? `<img class="game-image-main" src="${_assetPath(firstAsset.image)}" alt="">`
      : `<img class="game-image-main" src="${_assetPath(GAME_ENTRY_IMAGES[gameState.location] || GAME_ENTRY_IMAGES.warehouse)}" alt="">`;

    _setGamePages(
      `<div id="vocab-left-image">${firstImage}</div>`,
      `<div id="game-vocab-cards-mounted">${rightCards}</div>${_button('game-vocab-btn-mounted', '開始小任務')}`
    );

    const btn = document.getElementById('game-vocab-btn-mounted');
    btn.onclick = () => renderGameScreen('answer');

    for (let i = 0; i < vocabIds.length; i++) {
      const id = vocabIds[i];
      const asset = gameData.presentation.vocabulary_assets?.[id] || {};
      const leftEl = document.getElementById('vocab-left-image');
      if (leftEl && asset.image) {
        leftEl.innerHTML = `<img class="game-image-main" src="${_assetPath(asset.image)}" alt="">`;
      }
      if (asset.audio) {
        const textEl = document.getElementById(`vocab-card-${i}`);
        await _playGameTTS(asset.audio, { textElement: textEl });
      }
    }

    btn.classList.remove('hidden');
  }

  async function renderGameAnswer() {
    const type = gameData.manifest?.game_type || gameData.content?.game_type;
    if (type === 'listen_and_pick') return renderGameAnswerStandard('warehouse');
    if (type === 'find_the_odd_one_out') return renderGameAnswerStandard('market');
    if (type === 'identify_place' || type === 'fill_spatial_word') return renderGameAnswerStandard('bridge');
    if (type === 'emotion_recognition') return renderGameAnswerStandard('inn');
    if (type === 'measure_word_matching') return renderDockAnswer();
    return renderGameAnswerStandard('warehouse');
  }

  async function renderGameAnswerStandard(kind) {
    const cVar = gameState.contentVariation;
    const mVar = gameState.manifestVariation;
    const pVar = gameState.presentationVariation || {};
    const optionIds = mVar.option_ids || [];
    const topImage = _questionTopImage(kind);
    const firstStateBottom = _firstStateBottomHTML(kind);
    const fixed = gameData.content.fixed_sentence || '';
    const options = optionIds.map((optionId, index) => {
      const asset = _optionAsset(optionId);
      return `<button class="game-option-btn" data-option-id="${optionId}" disabled>${String.fromCharCode(65 + index)}. ${_escape(asset.word || asset.caption || optionId)}</button>`;
    }).join('');
    _setGamePages(
      `<div class="game-left-top">${topImage ? `<img class="game-character-img" id="game-answer-top-image" src="${_assetPath(topImage)}" alt="">` : ''}</div><div id="game-answer-visuals" class="game-left-bottom">${firstStateBottom}</div>`,
      `<div><div id="game-question-text" class="game-text">${_escape(cVar.question_text || '')}</div><div id="game-fixed-sentence" class="game-text hidden">${_escape(fixed)}</div></div><div class="game-options">${options}</div>`
    );
    _bindOptionButtons();
    await _playGameTTS(pVar.question_audio, { textElement: document.getElementById('game-question-text') });
    _showSecondStateVisuals(kind, optionIds);
    document.getElementById('game-fixed-sentence')?.classList.remove('hidden');
    await _playOptionAudios(optionIds);
    _unlockGameOptions();
  }

  function _questionTopImage(kind) {
    const p = gameData.presentation;
    const cVar = gameState.contentVariation;
    const pVar = gameState.presentationVariation || {};
    if (kind === 'warehouse') return p.character_assets?.cin_baak?.image;
    if (kind === 'market') return pVar.stall_image || p.character_assets?.[cVar.vendor_id]?.image;
    if (kind === 'bridge') return p.character_assets?.[cVar.speaker_id]?.image;
    if (kind === 'inn') return pVar.story_image;
    return null;
  }

  function _firstStateBottomHTML(kind) {
    if (kind === 'market') {
      const vendorId = gameState.contentVariation?.vendor_id;
      const image = gameData.presentation.character_assets?.[vendorId]?.image;
      return image ? `<img class="game-character-img" src="${_assetPath(image)}" alt="">` : '';
    }
    if (kind === 'inn') {
      const image = gameData.presentation.character_assets?.dou_sin_saang?.image;
      return image ? `<img class="game-character-img" src="${_assetPath(image)}" alt="">` : '';
    }
    return '';
  }

  function _showSecondStateVisuals(kind, optionIds) {
    const visual = document.getElementById('game-answer-visuals');
    if (!visual) return;
    if (kind === 'market') {
      // Replace vendor with object choices after the question has been heard.
      visual.innerHTML = _optionImages(optionIds);
      return;
    }
    if (kind === 'inn') {
      visual.innerHTML = _optionImages(optionIds);
      return;
    }
    visual.innerHTML = _optionImages(optionIds);
  }

  function _optionImages(optionIds) {
    return optionIds.map(optionId => {
      const asset = _optionAsset(optionId);
      const image = asset.image || _vocabImageForOption(optionId);
      return `<div class="game-left-item">${image ? `<img src="${_assetPath(image)}" alt="">` : ''}<span>${_escape(asset.caption || asset.word || '')}</span></div>`;
    }).join('');
  }

  function _optionAsset(optionId) {
    return gameData.presentation.option_assets?.[optionId] || {};
  }

  function _vocabImageForOption(optionId) {
    const vocabId = optionId.replace(/^opt_/, '');
    return gameData.presentation.vocabulary_assets?.[vocabId]?.image;
  }

  async function _playOptionAudios(optionIds) {
    await _playGameTTSSequence(optionIds.map(id => _optionAsset(id).audio));
  }

  function _bindOptionButtons() {
    document.querySelectorAll('.game-option-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        if (btn.disabled) return;
        onGameOptionSelected(btn.dataset.optionId);
      });
    });
  }

  function _unlockGameOptions() {
    document.querySelectorAll('.game-option-btn').forEach(btn => { btn.disabled = false; });
  }

  async function onGameOptionSelected(optionId) {
    gameState.selectedOptionId = optionId;
    gameState.isCorrect = _isCorrectOption(optionId);
    _recordGameAssessment(gameState.isCorrect, optionId);
    if ((gameData.manifest?.visual_state?.correct_trigger === 'on_correct') && gameState.isCorrect) {

    const evalVar = gameState.evaluationVariation || {};
    recordGameAttempt(gameState.gameId, gameState.variationId, {
      source: 'minigame',
      label: answerId,
      correct: isCorrect,
      dimension: evalVar.dimension,
      skill: evalVar.skill,
      vocabulary_intro_ids: gameState.contentVariation?.vocabulary_intro_ids || [],
    });

  async function recordGameAttempt(gameId, variationId, data) {
    if (!db || !state.uid) return;
    try {
      const attemptId = crypto.randomUUID();
      await db.collection('users').doc(state.uid)
        .collection('game_attempts').doc(gameId)
        .collection('attempts').doc(attemptId)
        .set({
          ...data,
          attempt_id: attemptId,
          game_id: gameId,
          variation_id: variationId,
          timestamp: firebase.firestore.FieldValue.serverTimestamp()
        });
    } catch (e) {
      logError(e.message, 'recordGameAttempt', state.uid);
    }

  function _feedbackText() {
    const templates = gameData.content.feedback_templates || {};
    let pool = null;
    if (gameState.isCorrect) {
      if (gameData.content.game_type === 'find_the_odd_one_out' || gameState.location === 'market') {
        pool = templates[gameState.contentVariation.vendor_id]?.correct;
      } else {
        pool = templates.correct;
      }
    } else if (gameState.location === 'bridge') {
      pool = gameState.contentVariation.speaker_id === 'edmund' ? templates.wrong_edmund : templates.wrong_margaret;
    } else if (gameState.location === 'market') {
      pool = templates[gameState.contentVariation.vendor_id]?.wrong;
    } else {
      pool = templates.wrong;
    }
    let text = _randomFrom(pool) || '';
    const restate = gameState.contentVariation?.answer_restate || '';
    text = text.replace('[answer_restate]', restate);
    if (!gameState.isCorrect && restate && !text.includes(restate)) text += ` ${restate}`;
    return text;
  }

  function _feedbackImage() {
    const p = gameData.presentation;
    if (gameState.location === 'warehouse') return p.character_assets?.cin_baak?.image;
    if (gameState.location === 'market') return p.character_assets?.[gameState.contentVariation.vendor_id]?.image;
    if (gameState.location === 'bridge') {
      if (gameState.isCorrect) return gameState.presentationVariation?.reunion_image || p.character_assets?.edmund_margaret_reunion?.image;
      return p.character_assets?.[gameState.contentVariation.speaker_id]?.image;
    }
    if (gameState.location === 'inn') return p.character_assets?.dou_sin_saang?.image;
    if (gameState.location === 'dock') return p.character_assets?.sek_tau?.image;
    return null;
  }

  async function _playFeedbackAudio() {
    const p = gameData.presentation;
    const pVar = gameState.presentationVariation || {};
    let audio = null;
    if (pVar.feedback_audio) {
      audio = gameState.isCorrect ? pVar.feedback_audio.correct : pVar.feedback_audio.wrong;
    }
    if (!audio && p.feedback_assets) {
      const prefix = gameState.location === 'market' ? `${gameState.contentVariation.vendor_id}_` : '';
      const keys = Object.keys(p.feedback_assets).filter(k => k.startsWith(`${prefix}${gameState.isCorrect ? 'correct' : 'wrong'}_`));

      audio = p.feedback_assets[key]?.audio;

    const appearsAfter = String(loc.appears_after_event || '').replace(/^story_/, '');

  function getGameBtnState(loc, completed) {
    if (!_isLocationVisible(loc, completed)) return 'hidden';
    if (_isGameUnlocked(loc)) return _isLocationColored(loc.location_id) ? 'done' : 'ready';
    return state.coins >= (loc.unlock_cost || 0) ? 'unlockable' : 'locked';
  }

  function applyGameBtnState(btn, gameStateName, loc) {
    btn.className = 'pin-game-btn';
    switch (gameStateName) {
      case 'hidden':
        btn.classList.add('hidden');
        break;
      case 'locked':
        btn.classList.add('pin-game-locked', 'pin-game-show-cost');
        btn.textContent = `🔒 ${loc.unlock_cost}銅錢`;
        btn.addEventListener('click', () => showAsui('R6'));
        break;
      case 'unlockable':
        btn.classList.add('pin-game-unlockable');
        btn.textContent = `🔓 ${loc.unlock_cost}銅錢`;
        btn.addEventListener('click', () => tryUnlockGame(loc.location_id, loc.unlock_cost));
        break;
      case 'ready':
        btn.classList.add('pin-game-ready');
        btn.textContent = _gameTitleForLocation(loc);
        btn.addEventListener('click', () => enterGame(loc.location_id));
        break;
      case 'done':
        btn.classList.add('pin-game-done');
        btn.textContent = _gameTitleForLocation(loc);
        btn.addEventListener('click', () => enterGame(loc.location_id));
        break;
    }

  function tryUnlockGame(locationId, cost) {
    if (state.coins < cost) {
      showAsui('R6');
      return;
    }
    const dialogueId = UNLOCK_DIALOGUE[locationId];
    showAsui(dialogueId, {
      onConfirm: () => {
        state.coins -= cost;
        if (!state.paid_games) state.paid_games = [];
        if (!state.unlocked_games) state.unlocked_games = [];
        if (!state.paid_games.includes(locationId)) state.paid_games.push(locationId);
        const gameRef = _gameRefForLocation(locationId);
        if (gameRef && !state.unlocked_games.includes(gameRef)) state.unlocked_games.push(gameRef);
        updateCoinDisplay();
        _saveMapProgress();
        enterGame(locationId);
      },
      onCancel: () => hideAsui()
    });
  }

  function _isGameUnlocked(loc) {
    const paid = state.paid_games || [];
    const unlocked = state.unlocked_games || [];
    return paid.includes(loc.location_id)
      || unlocked.includes(loc.location_id)
      || unlocked.includes(loc.game_ref)
      || unlocked.includes(_gameRefForLocation(loc.location_id));
  }

  function _nextStoryTarget(chapterId) {
    const currentScene = state.current_scene;

    const colored = state.map_colored || state.colored_locations || [];

  function _reportLevelToStars(level) {
    const count = 6 - level;
    return '★'.repeat(count) + '☆'.repeat(5 - count);
  }

  function _reportAssessmentNodes() {
    if (Array.isArray(state.assessment_nodes) && state.assessment_nodes.length) {
      return state.assessment_nodes;
    }
    try {
      const cached = JSON.parse(localStorage.getItem('la_assessment') || '{}');
      if (Array.isArray(cached.nodes)) return cached.nodes;
      return Object.entries(cached).map(([sceneId, data]) => ({ sceneId, ...data }));
    } catch {
      return [];
    }
  }

  function _calculateDimensions() {
    const nodes = _reportAssessmentNodes();
    const dims = {
      vocabulary: { score: 0, max: 0 },
      context_understanding: { score: 0, max: 0 },
      social_understanding: { score: 0, max: 0 },
      information_integration: { score: 0, max: 0 },
      value_judgment: { score: 0, max: 0 }
    };

    nodes.filter(n => n.collect_type === 'assessment').forEach(n => {
      const score = n.scoring?.[n.label] ?? 0;
      const dimensions = Array.isArray(n.dimension) ? n.dimension : [n.dimension].filter(Boolean);
      const [primary, secondary] = dimensions;
      if (primary && dims[primary] !== undefined) {
        dims[primary].score += score;
        dims[primary].max += 1;
      }
      if (secondary && dims[secondary] !== undefined) {
        dims[secondary].score += score * 0.5;
        dims[secondary].max += 0.5;
      }
    });

    const result = {};
    Object.keys(dims).forEach(key => {
      const { score, max } = dims[key];
      const pct = max > 0 ? score / max : 0;
      result[key] = pct >= 0.75 ? 1 : pct >= 0.50 ? 2 : pct >= 0.25 ? 3 : 4;
    });
    return result;
  }

  function _extractExplorationData() {
    const nodes = _reportAssessmentNodes();
    const exploration = nodes
      .filter(n => n.collect_type === 'exploration' || n.collect_type === 'hidden_assessment')
      .map(n => ({ scene_id: n.sceneId, exp_tag: n.exp_tag, label: n.label }));
    const hiddenNodes = nodes
      .filter(n => n.collect_type === 'hidden_remedial' || n.collect_type === 'hidden_assessment')
      .map(n => ({ scene_id: n.sceneId, trigger: n.trigger }));
    return { exploration, hiddenNodes };
  }

  function _renderDimensions(dimensions) {
    const container = document.getElementById('report-dimensions');
    container.innerHTML = '';
    DIMENSION_CONFIG.forEach(({ key, label }) => {
      const level = dimensions[key] || 4;
      const row = document.createElement('div');
      row.className = 'report-dimension-row';
      row.innerHTML = `
        <div class="dimension-label">${label}</div>
        <div class="dimension-stars">${_reportLevelToStars(level)}</div>
        <div class="dimension-desc">${DIMENSION_DESCRIPTIONS[key][level - 1]}</div>
      `;
      container.appendChild(row);
    });
  }

  function _showQualitativeLoading() {
    document.getElementById('report-qualitative-text').textContent = '';
    document.getElementById('report-qualitative-loading').classList.remove('hidden');
  }

  function _fillQualitativeReport(text) {
    document.getElementById('report-qualitative-loading').classList.add('hidden');
    document.getElementById('report-qualitative-text').textContent = text;
  }

  async function _loadScript(src) {
    return new Promise((resolve, reject) => {
      if (document.querySelector(`script[src="${src}"]`)) { resolve(); return; }
      const s = document.createElement('script');
      s.src = src;
      s.onload = resolve;
      s.onerror = reject;
      document.head.appendChild(s);
    });
  }

  async function downloadReport() {
    const btn = document.getElementById('btn-download-report');
    btn.disabled = true;
    btn.textContent = '準備中…';
    try {
      await _loadScript('https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js');
      await _loadScript('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js');
      const canvas = await html2canvas(document.getElementById('report-scroll'), {
        scale: 2,
        useCORS: true,
        backgroundColor: '#F5F0E8'
      });
      const { jsPDF } = window.jspdf;
      const pdf = new jsPDF({ orientation: 'portrait', unit: 'px', format: 'a4' });
      const pageWidth = pdf.internal.pageSize.getWidth();
      const pageHeight = pdf.internal.pageSize.getHeight();
      const imgWidth = pageWidth;
      const imgHeight = (canvas.height * imgWidth) / canvas.width;
      let y = 0;
      while (y < imgHeight) {
        if (y > 0) pdf.addPage();
        pdf.addImage(canvas, 'PNG', 0, -y, imgWidth, imgHeight);
        y += pageHeight;
      }
      pdf.save('小學徒大世界_第一章報告.pdf');
    } catch (e) {
      logError('PDF download failed', 'downloadReport', getCurrentUserId());
    } finally {
      btn.disabled = false;
      btn.textContent = '下載報告';
    }
  }

  function leaveReport() {
    showRoom('map-house');
    enterMap();
  }

  async function enterReport() {
    showRoom('report-house');
    handleRoomTransition('room-report');

    const dimensions = _calculateDimensions();
    const { exploration, hiddenNodes } = _extractExplorationData();
    const uid = getCurrentUserId();

    _showQualitativeLoading();
    const reportPromise = requestReport(uid, 'event_1', dimensions, exploration, hiddenNodes)
      .then(result => (typeof result === 'string' ? result : result?.report) || REPORT_FALLBACK_TEXT)
      .catch(() => REPORT_FALLBACK_TEXT);

    const transition = document.getElementById('report-transition');
    const transitionText = document.getElementById('report-transition-text');
    const body = document.getElementById('report-body');
    transition.style.display = 'flex';
    transitionText.style.animation = 'none';
    void transitionText.offsetWidth;
    transitionText.style.animation = '';
    body.classList.add('hidden');
    body.classList.remove('visible');

    await new Promise(resolve => setTimeout(resolve, 2800));

    transition.style.display = 'none';
    body.classList.remove('hidden');
    requestAnimationFrame(() => body.classList.add('visible'));

    _renderDimensions(dimensions);

    const reportText = await reportPromise;
    _fillQualitativeReport(reportText);

    document.getElementById('btn-download-report').onclick = downloadReport;
    document.getElementById('btn-back-to-map').onclick = leaveReport;
  }

  window.enterReport = enterReport;
  window.downloadReport = downloadReport;
  // ========== 模塊：報告房 END ==========

  // ========== 啟動 ==========
  (async function init() {
    await loadGlobalData();
    initGlobalUI();
    initProgressPanelDevEntry();
    await initAudioManager();
    await initAsui();
    // Firebase onAuthStateChanged 接管後續流程
    initOpeningHouse();
  })();

  </script>
</body>
</html>

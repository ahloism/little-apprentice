  function showRoom(roomId) {
    document.getElementById('page-left')?.classList.remove('scrollable');
    // 隱藏所有房間內容
    const rooms = ['opening-house', 'story-house', 'notebook-house', 'game-house', 'map-house', 'report-house', 'catalogue-house', 'reread-house', 'settings-house'];
    // 底部導航列顯示規則
    const bottomNavRooms = ['story-house', 'game-house', 'catalogue-house', 'reread-house', 'notebook-house', 'settings-house', 'map-house'];
    // 附錄體系房間及大地圖：只顯示「回目錄」，隱藏「回大地圖」
    const catalogueOnlyRooms = ['catalogue-house', 'reread-house', 'notebook-house', 'settings-house', 'map-house'];
    const bottomNav = document.getElementById('bottom-nav');
    const btnBackToMap = document.getElementById('btn-back-to-map-nav');
    const btnCatalogue = document.getElementById('btn-catalogue-nav');
    if (bottomNav) {
      if (bottomNavRooms.includes(roomId)) {
        bottomNav.classList.remove('hidden');
      } else {
        bottomNav.classList.add('hidden');
      }
    }
    if (btnBackToMap) {
      btnBackToMap.style.display = catalogueOnlyRooms.includes(roomId) ? 'none' : '';
    }
    if (btnCatalogue) {
      btnCatalogue.style.display = '';
    }
    rooms.forEach(id => {
      const el = document.getElementById(id);
      if (el) el.classList.add('hidden');
    });
    // 顯示指定房間
    const target = document.getElementById(roomId);
    if (target) target.classList.remove('hidden');
  }

  function playBookOpenAnimation(onComplete) {
    const overlay = document.getElementById('white-overlay');
    if (!overlay) { if (onComplete) onComplete(); return; }
    // 第一段：漸白（300ms）
    overlay.style.transition = 'opacity 0.3s ease';
    overlay.style.opacity = '1';
    setTimeout(() => {
      // 切換房間
      if (onComplete) onComplete();
      // 第二段：從白淡入（400ms）
      setTimeout(() => {
        overlay.style.transition = 'opacity 0.4s ease';
        overlay.style.opacity = '0';
      }, 50);
    }, 320);
  }

  function initOpeningHouse() {
    const container = document.getElementById('opening-house');
    container.innerHTML = `
      <video id="opening-video" src="../video/video_01_封面.mp4" playsinline muted style="width:100%;height:100%;object-fit:cover;position:absolute;inset:0;"></video>
      <div id="opening-ui" class="hidden" style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;">
        <img src="../image/A02_封面.png" style="max-width:80%;max-height:50vh;object-fit:contain;" />
        <div id="opening-buttons" style="display:flex;flex-direction:column;align-items:center;gap:16px;"></div>
      </div>
      <div id="opening-confirm" class="hidden" style="position:absolute;inset:0;background:rgba(0,0,0,0.6);display:flex;align-items:center;justify-content:center;">
        <div style="background:var(--white);border-radius:16px;padding:32px;text-align:center;max-width:320px;">
          <p style="font-size:18px;margin-bottom:24px;">重新開始會清除所有進度，確定嗎？</p>
          <div style="display:flex;gap:16px;justify-content:center;">
            <button id="btn-confirm-restart" style="background:#d4870a;color:var(--white);border:none;border-radius:8px;padding:12px 24px;font-size:16px;cursor:pointer;">確定重新開始</button>
            <button id="btn-cancel-restart" style="background:transparent;color:#333;border:2px solid #333;border-radius:8px;padding:12px 24px;font-size:16px;cursor:pointer;">取消</button>
          </div>
        </div>
      </div>
    `;

    const video = document.getElementById('opening-video');
    const openingUI = document.getElementById('opening-ui');

    // 影片結束後顯示UI
    video.addEventListener('ended', () => {
      openingUI.classList.remove('hidden');
      playBGM('BGM_04');
      _renderOpeningButtons();
    });

    // iOS autoplay需user gesture，若影片無法自動播放則直接顯示UI
    video.play().catch(() => {
      openingUI.classList.remove('hidden');
      playBGM('BGM_04');
      _renderOpeningButtons();
    });

    // 二次確認彈窗按鈕
    document.getElementById('btn-confirm-restart').addEventListener('click', async () => {
      await _doRestart();
    });
    document.getElementById('btn-cancel-restart').addEventListener('click', () => {
      document.getElementById('opening-confirm').classList.add('hidden');
    });
  }

  function _renderOpeningButtons() {
    const btns = document.getElementById('opening-buttons');
    btns.innerHTML = '';

    if (!auth || !state.uid) {
      // 未登入：Google官方登入按鈕
      btns.innerHTML = `
        <div id="g-signin-btn" style="cursor:pointer;">
          <img src="https://developers.google.com/identity/images/btn_google_signin_light_normal_web.png" alt="Sign in with Google" style="height:50px;" />
        </div>
        ${!_firebaseReady ? '<div style="color:var(--white);background:rgba(0,0,0,0.55);padding:8px 12px;border-radius:8px;font-size:14px;">Firebase config 未設定，登入功能未啟用</div>' : ''}
      `;
      document.getElementById('g-signin-btn').addEventListener('click', () => {
        unlockAudioContext();
        if (!auth) return;
        const provider = new firebase.auth.GoogleAuthProvider();
        auth.signInWithPopup(provider).catch(e => logError(e.message, 'signInWithPopup', null));
      });
    } else if (!state.current_scene) {
      // 已登入，無進度
      btns.innerHTML = `<button id="btn-start" style="background:var(--sign-fill);color:var(--sign-text);border:2px solid var(--sign-border);border-radius:8px;padding:16px 40px;font-size:22px;cursor:pointer;font-family:var(--hei);">開始冒險</button>`;
      document.getElementById('btn-start').addEventListener('click', () => {
        unlockAudioContext();
        _enterStory('1_1_1');
      });
    } else {
      // 已登入，有進度
      const eventId = state.current_scene.split('_').slice(0,2).join('_');
      loadEventData(eventId); // 靜默預載
      btns.innerHTML = `
        <button id="btn-continue" style="background:var(--sign-fill);color:var(--sign-text);border:2px solid var(--sign-border);border-radius:8px;padding:16px 40px;font-size:22px;cursor:pointer;font-family:var(--hei);">繼續冒險</button>
        <button id="btn-restart" style="background:transparent;color:rgba(255,255,255,0.85);border:1.5px solid rgba(255,255,255,0.5);border-radius:8px;padding:12px 32px;font-size:18px;cursor:pointer;font-family:var(--hei);">重新開始</button>
      `;
      document.getElementById('btn-continue').addEventListener('click', () => {
        unlockAudioContext();
        _enterStory(state.current_scene);
      });
      document.getElementById('btn-restart').addEventListener('click', () => {
        document.getElementById('opening-confirm').classList.remove('hidden');
      });
    }
  }

  async function _enterStory(sceneId) {
    playSFX('SFX_08');
    document.getElementById('book-wrapper').classList.remove('hidden');
    document.getElementById('opening-house').classList.add('hidden');
    playBookOpenAnimation(() => {
      showRoom('story-house');
      handleRoomTransition('room-story');
      // Story房載入指定scene（由Story房模塊處理）
      document.dispatchEvent(new CustomEvent('story:load', { detail: { sceneId } }));
    });
  }

  async function _doRestart() {
    localStorage.removeItem('la_progress');
    localStorage.removeItem('la_assessment');
    const cleanProgress = {
      current_scene: null,
      current_event: null,
      coins: 0,
      completed_events: [],
      map_segments: {},
      explored_scenes: [],
      visited_sub_scenes: {},
      assessment_nodes: [],
      claimed_rewards: [],
    };
    Object.assign(state, cleanProgress);
    if (auth && state.uid) {
      try {
        await db.collection('users').doc(state.uid).collection('progress').doc('current').set(cleanProgress);
      } catch(e) { logError(e.message, 'restart_save', state.uid); }
    }
    document.getElementById('opening-confirm').classList.add('hidden');
    _renderOpeningButtons();
  }

  let _storyEventId = null;

  function _storyList(data) {
    if (!data) return [];
    return Array.isArray(data) ? data : (data.scenes || []);
  }

  function _storyEvalList() {
    if (!eventData.evaluation) return [];
    return Array.isArray(eventData.evaluation)
      ? eventData.evaluation
      : (
          eventData.evaluation.scenes ||
          eventData.evaluation.nodes ||
          eventData.evaluation.evaluation_nodes ||
          []
        );
  }

  function _findByScene(list, sceneId) {
    return (list || []).find(item => item.scene_id === sceneId) || null;
  }

  function _sceneEventId(sceneId) {
    return String(sceneId || '').split('_').slice(0, 2).join('_');
  }

  function _normalizeStoryEventId(eventIdOrSceneId) {
    const raw = String(eventIdOrSceneId || '').replace(/^story_/, '');
    const parts = raw.split('_');
    return parts.length >= 2 ? `${parts[0]}_${parts[1]}` : raw;
  }

  function _storyStartScene() {
    return eventData.manifest?.start_scene || _storyList(eventData.story)[0]?.scene_id || '1_1_1';
  }

  const _LOCATION_NAMES = {
    warehouse: '商行',
    market: '市集',
    bridge: '橋邊',
    inn: '客棧',
    dock: '碼頭',
  };

  function _chapterToChinese(n) {
    return ({1:'一',2:'二',3:'三',4:'四',5:'五',6:'六',7:'七',8:'八',9:'九',10:'十'})[n] || String(n || '');
  }

  function _storyLocationLabel() {
    const parts = (_storyEventId || '').split('_');
    const chapterNum = parts[1] || '';
    const location = eventData.manifest?.location || '';
    const locationName = _LOCATION_NAMES[location] || location;
    const eventTitle = eventData.story?.title || locationName;
    return chapterNum ? `第${_chapterToChinese(parseInt(chapterNum))}章·${eventTitle}` : eventTitle;
  }

  async function _updateChapterProgressDots(currentSceneId) {
    const dotsContainer = document.getElementById('chapter-progress-dots');
    if (!dotsContainer) return;
    dotsContainer.innerHTML = '';

    try {
      const progressContent = await loadJSON('json/progress_content_1.json');
      const chapters = progressContent?.chapters || [];
      const parts = (currentSceneId || '').split('_');
      const chapterId = parts.slice(0, 2).join('_');
      const chapter = chapters.find(c => c.chapter_id === chapterId);
      if (!chapter) return;

      const scenes = chapter.scenes || [];
      const completedScenes = state.completed_events || [];

      scenes.forEach((s, idx) => {
        if (idx > 0) {
          const line = document.createElement('div');
          line.className = 'chapter-dot-line';
          const prevScene = scenes[idx - 1];
          if (completedScenes.includes(prevScene.scene_id)) {
            line.classList.add('visited');
          }
          dotsContainer.appendChild(line);
        }
        const dot = document.createElement('div');
        dot.className = 'chapter-dot';
        if (s.scene_id === currentSceneId) {
          dot.classList.add('active');
        } else if (completedScenes.includes(s.scene_id)) {
          dot.classList.add('visited');
        }
        dotsContainer.appendChild(dot);
      });
    } catch (e) {
      // 靜默失敗，不影響主流程
    }
  }

  function _storyImagePath(imageId) {
    if (!imageId) return '';
    const file = STORY_IMAGE_FILES[imageId] || imageId;
    return `${BASE_PATH}${IMAGE_BASE}${file}`;
  }




  function _lineText(line) {
    return typeof line === 'string' ? line : (line?.text || '');
  }




  function _audioPath(filename) {
    return filename ? `${TTS_BASE}${filename}` : '';
  }

  function _timestampPath(filename) {
    return filename ? `${TTS_BASE}${filename.replace('.mp3', '.json')}` : '';
  }

  async function playLinesSequence(audioList, textLines, textContainer, presentation = {}) {
    const lineEls = textContainer.querySelectorAll('p[data-line-index]');
    for (let i = 0; i < (textLines || []).length; i++) {
      _triggerImageCue(presentation, i);
      if (!state.tts_on) break;
      const audio = audioList?.[i];
      if (audio) {
        await playLine(_audioPath(audio), _timestampPath(audio), lineEls[i]);
      }
      if (!state.tts_on) break;
    }
    _lockUI(false);
  }

  async function _playQuestionAndChoices(scene, presentation) {
    const questionEl = document.getElementById('story-question-area');
    const choicesArea = document.getElementById('story-choices-area');
    _setQuestion(scene.question || '');
    if (presentation?.audio?.question) {
      questionEl.innerHTML = Array.from(scene.question || '').map(ch => `<span class="hl">${ch}</span>`).join('');
      await playLine(_audioPath(presentation.audio.question), _timestampPath(presentation.audio.question), questionEl);
      questionEl.textContent = scene.question || '';
    }
    playSFX('SFX_01');
    choicesArea.querySelectorAll('button').forEach(btn => btn.disabled = true);
    const choiceAudios = presentation?.audio?.choices || [];
    const playableChoiceCount = Math.min(choiceAudios.length, scene.choices?.length || 0);
    for (let i = 0; i < playableChoiceCount; i++) {
      const btn = choicesArea.querySelector(`[data-choice-index="${i}"]`);
      if (btn) btn.classList.add('listening');
      const choiceTextEl = btn ? btn.querySelector('.choice-hl-text') : null;
      await playLine(_audioPath(choiceAudios[i]), _timestampPath(choiceAudios[i]), choiceTextEl || btn);
      if (btn) btn.classList.remove('listening');
    }
    choicesArea.querySelectorAll('button').forEach(btn => btn.disabled = false);
  }

  function _choiceButton(choice, index, onClick, explored = false) {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.dataset.choiceIndex = String(index);
    btn.style.cssText = `text-align:left;border:2px solid var(--sign-border);background:${explored ? 'var(--paper-deep)' : 'var(--sign-fill)'};color:var(--sign-text);border-radius:6px;padding:12px 16px;font-size:18px;line-height:1.45;cursor:pointer;font-family:var(--hei);`;
    const labelStr = choice.label || String.fromCharCode(65 + index);
    const choiceText = choice.text || '';
    const hlSpans = Array.from(choiceText).map(ch => `<span class="hl">${ch}</span>`).join('');
    btn.innerHTML = `<strong>${labelStr}.</strong> <span class="choice-hl-text">${hlSpans}</span>${explored ? ' <span style="color:#7a6241;">（已探索）</span>' : ''}`;
    btn.disabled = true;
    btn.addEventListener('click', () => onClick(choice, index));
    return btn;
  }

  function _renderChoices(scene, onClick, exploredLabels = new Set()) {
    const area = document.getElementById('story-choices-area');
    area.innerHTML = '';
    (scene.choices || []).forEach((choice, index) => {
      area.appendChild(_choiceButton(choice, index, onClick, exploredLabels.has(choice.label)));
    });
  }

  function _renderAdvance(label, onClick) {
    const area = document.getElementById('story-advance-btn');
    area.innerHTML = '';
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.textContent = label || eventData.presentation?.default_advance_label || '繼續';
    btn.style.cssText = 'background:var(--sign-fill);color:var(--sign-text);border:2px solid var(--sign-border);border-radius:6px;padding:14px 34px;font-size:20px;cursor:pointer;font-family:var(--hei);';
    btn.addEventListener('click', onClick);
    area.appendChild(btn);
  }

  function _rewardAmount(manifestScene, correct = true, includeBonus = false) {
    const reward = manifestScene?.reward || {};
    return (reward.base || 0) + ((includeBonus && correct) ? (reward.bonus || 0) : 0);
  }

  function _markVisitedSubScene(parentSceneId, choice) {
    const key = parentSceneId || _storyParentSceneId || 'story';
    const tag = choice.exp_tag || choice.label || choice.next_scene;
    markSubSceneVisited(key, tag, choice.next_scene || tag);
  }

  function _visitedLabels(sceneId) {
    return getVisitedSubSceneTags(sceneId);
  }

  function _collectAssessmentPayload(scene, evaluation, choice = null, correct = null) {
    return {
      collect_type: evaluation?.collect_type || null,
      dimension: evaluation?.dimension || [],
      trigger: evaluation?.trigger || null,
      label: choice?.label || null,
      text: choice?.text || null,
      correct,
      scoring: evaluation?.scoring || null,
      timestamp: Date.now(),
    };
  }

  function _isCorrectChoice(evaluation, choice) {
    const support = evaluation?.support_option || [];
    return !support.includes(choice?.label);
  }

  function _linesForVisit(scene) {
    if (!scene.visit_count_responses) return scene.lines || [];
    const key = scene.scene_id;
    _storyVisitCounts[key] = (_storyVisitCounts[key] || 0) + 1;
    const responses = scene.visit_count_responses;
    const index = Math.min(_storyVisitCounts[key], responses.length) - 1;
    return responses[index]?.lines || scene.lines || [];
  }

  async function enterStory(eventIdOrSceneId, explicitSceneId = null) {
    _ensureStoryDOM();
    const eventId = _normalizeStoryEventId(eventIdOrSceneId);
    _storyEventId = eventId;
    document.getElementById('book-wrapper').classList.remove('hidden');
    document.getElementById('story-house').classList.remove('hidden');
    showRoom('story-house');
    handleRoomTransition('room-story');
    await loadEventData(eventId);
    if (document.getElementById('story-house')?.classList.contains('hidden')) return;

    const forcedStartEvents = new Set(['1_4', '1_7']);
    const sameEventSavedScene = getSavedSceneForEvent(eventId);
    const startScene = explicitSceneId || (forcedStartEvents.has(eventId) ? _storyStartScene() : (sameEventSavedScene || _storyStartScene()));
    await renderScene(startScene);
  }

  async function renderScene(sceneId) {
    resumeTTS();
    invalidateTTSSession('renderScene');
    _ensureStoryDOM();
    const scene = _findByScene(_storyList(eventData.story), sceneId);
    if (!scene) {
      logError(`Scene not found: ${sceneId}`, 'renderScene', getCurrentUserId());
      return;
    }
    if (!_storyEventId) _storyEventId = _sceneEventId(sceneId);

    const presentation = _findByScene(_storyList(eventData.presentation), sceneId) || {};
    const manifestScene = _findByScene(_storyList(eventData.manifest), sceneId);
    const evaluation = _findByScene(_storyEvalList(), sceneId);
    if (!evaluation && ['assessment','hidden_assessment','hidden_remedial'].includes(manifestScene?.type)) {
      console.warn('[Assessment] evaluation missing for', sceneId, 'type:', manifestScene?.type);
    }
    const type = manifestScene?.type || 'feedback';
    const textArea = document.getElementById('story-text-area');

    setCurrentScene(sceneId);
    const parts = (_storyEventId || '').split('_');
    const chapterNum = parts[1] || '';
    const tagContainer = document.getElementById('scene-chapter-tag-container');
    if (tagContainer) {
      tagContainer.innerHTML = chapterNum
        ? `<span class="scene-chapter-tag">第${_chapterToChinese(parseInt(chapterNum))}章</span>`
        : '';
    }
    document.getElementById('story-event-label').textContent = _storyLocationLabel();
    document.getElementById('story-scene-title-el').textContent = scene.title || '';
    _updateChapterProgressDots(sceneId);
    _clearStoryControls();
    updateStoryImage(presentation);
    _renderLines(_linesForVisit(scene), textArea);
    if (isSavePoint(sceneId)) {
      await saveCurrentProgress();
      if (document.getElementById('story-house')?.classList.contains('hidden')) return;
    }

    const handlers = {
      story: handleStoryScene,
      explore: handleExploreScene,
      free_explore: handleFreeExploreScene,
      assessment: handleAssessmentScene,
      assessment_remedial: handleAssessmentRemedialScene,
      hidden_assessment: handleHiddenAssessmentScene,
      hidden_remedial: handleHiddenAssessmentScene,
      event_end: handleEventEndScene,
      feedback: handleFeedbackScene,
    };
    const handler = handlers[type] || handleFeedbackScene;
    await handler(scene, presentation, manifestScene, evaluation);
  }

  async function handleStoryScene(scene, presentation, manifestScene) {
    const textArea = document.getElementById('story-text-area');
    await playLinesSequence(presentation?.audio?.lines || [], Array.from(textArea.children).map(el => ({ text: el.textContent })), textArea, presentation);
    if (document.getElementById('story-house')?.classList.contains('hidden')) return;
    _renderAdvance(presentation?.advance_label, async () => {
      const amount = _rewardAmount(manifestScene);
      if (amount) claimReward('scene_reward_' + scene.scene_id, amount);
      if (scene.next_scene) renderScene(scene.next_scene);
    });
  }

  async function handleExploreScene(scene, presentation, manifestScene) {
    const textArea = document.getElementById('story-text-area');
    await playLinesSequence(presentation?.audio?.lines || [], Array.from(textArea.children).map(el => ({ text: el.textContent })), textArea, presentation);
    if (document.getElementById('story-house')?.classList.contains('hidden')) return;
    _renderChoices(scene, (choice) => {
      document.getElementById('story-choices-area')?.querySelectorAll('button').forEach(btn => btn.disabled = true);
      const amount = _rewardAmount(manifestScene);
      if (amount) claimReward('scene_reward_' + scene.scene_id, amount);
      _markVisitedSubScene(scene.scene_id, { ...choice, exp_tag: manifestScene?.exp_tag || choice.label });
      if (choice.next_scene) renderScene(choice.next_scene);
    });
    await _playQuestionAndChoices(scene, presentation);
    if (document.getElementById('story-house')?.classList.contains('hidden')) return;
  }

  async function handleFreeExploreScene(scene, presentation, manifestScene) {
    const textArea = document.getElementById('story-text-area');
    await playLinesSequence(presentation?.audio?.lines || [], Array.from(textArea.children).map(el => ({ text: el.textContent })), textArea, presentation);
    if (document.getElementById('story-house')?.classList.contains('hidden')) return;
    const visited = _visitedLabels(scene.scene_id);
    _renderChoices(scene, (choice) => {
      document.getElementById('story-choices-area')?.querySelectorAll('button').forEach(btn => btn.disabled = true);
      _storyParentSceneId = scene.scene_id;
      _markVisitedSubScene(scene.scene_id, { ...choice, exp_tag: choice.label });
      if (choice.next_scene) renderScene(choice.next_scene);
    }, visited);
    await _playQuestionAndChoices(scene, presentation);
    if (document.getElementById('story-house')?.classList.contains('hidden')) return;

    const threshold = manifestScene?.unlock_threshold || scene.choices?.length || 0;
    if (visited.size >= threshold) {
      const exitOption = scene.exit_option;
      const exitLabel = exitOption?.text || presentation?.advance_label || '繼續';
      const exitNext = exitOption?.next_scene || scene.next_scene;
      _renderAdvance(exitLabel, () => {
        const allExplored = visited.size >= (scene.choices?.length || 0);
        const amount = _rewardAmount(manifestScene, allExplored, allExplored);
        const rewardId = allExplored ? 'free_explore_bonus_' + scene.scene_id : 'scene_reward_' + scene.scene_id;
        if (amount) claimReward(rewardId, amount);
        if (exitNext) renderScene(exitNext);
      });
    }
  }

  async function handleAssessmentScene(scene, presentation, manifestScene, evaluation) {
    const textArea = document.getElementById('story-text-area');
    await playLinesSequence(presentation?.audio?.lines || [], Array.from(textArea.children).map(el => ({ text: el.textContent })), textArea, presentation);
    if (document.getElementById('story-house')?.classList.contains('hidden')) return;
    _renderChoices(scene, async (choice) => {
      document.getElementById('story-choices-area')?.querySelectorAll('button').forEach(btn => btn.disabled = true);
      const correct = _isCorrectChoice(evaluation, choice);
      recordAssessment(_storyEventId, scene.scene_id, _collectAssessmentPayload(scene, evaluation, choice, correct));
      await playSFX(correct ? 'SFX_02' : 'SFX_03');
      const amount = _rewardAmount(manifestScene, correct, true);
      if (amount) claimReward('scene_reward_' + scene.scene_id, amount);
      if (choice.next_scene) renderScene(choice.next_scene);
    });
    await _playQuestionAndChoices(scene, presentation);
    if (document.getElementById('story-house')?.classList.contains('hidden')) return;
  }

  async function handleAssessmentRemedialScene(scene, presentation, manifestScene, evaluation) {
    await handleAssessmentScene(scene, presentation, manifestScene, evaluation);
  }

  async function handleHiddenAssessmentScene(scene, presentation, manifestScene, evaluation) {
    const textArea = document.getElementById('story-text-area');
    await playLinesSequence(presentation?.audio?.lines || [], Array.from(textArea.children).map(el => ({ text: el.textContent })), textArea, presentation);
    if (document.getElementById('story-house')?.classList.contains('hidden')) return;

    if (scene.choices && scene.choices.length > 0) {
      // 評估型隱藏節點：顯示選項，靜默記錄，不顯示對錯反饋
      // 注意：_renderChoices 先於 await _playQuestionAndChoices，與 handleAssessmentScene 一致
      // 已知風險：TTS 播放期間玩家可點選項推進，日後可改為 await TTS 後再 render choices
      _renderChoices(scene, (choice) => {
        document.getElementById('story-choices-area')?.querySelectorAll('button').forEach(btn => btn.disabled = true);
        recordAssessment(_storyEventId, scene.scene_id, _collectAssessmentPayload(scene, evaluation, choice, null));
        if (choice.next_scene) renderScene(choice.next_scene);
      });
      await _playQuestionAndChoices(scene, presentation);
      if (document.getElementById('story-house')?.classList.contains('hidden')) return;
    } else {
      // 補救型隱藏節點：無選項，系統標記，直接推進
      recordAssessment(_storyEventId, scene.scene_id, _collectAssessmentPayload(scene, evaluation, null, null));
      if (scene.next_scene) renderScene(scene.next_scene);
    }
  }

  async function handleEventEndScene(scene, presentation, manifestScene) {
    const textArea = document.getElementById('story-text-area');
    await playLinesSequence(presentation?.audio?.lines || [], Array.from(textArea.children).map(el => ({ text: el.textContent })), textArea, presentation);
    if (document.getElementById('story-house')?.classList.contains('hidden')) return;

    _notebookReviewMode = true;
    _notebookReviewSource = source;
    showRoom('notebook-house');
    handleRoomTransition('notebook');
    await loadNotebookData(eventId);

  let _notebookReviewMode = false;
  let _notebookReviewSource = 'progress'; // 'progress' | 'map'
  let _progressPanelSource = null; // null | 'map'
  const _notebookDataCache = {};

  async function loadNotebookData(eventId) {
    if (_notebookDataCache[eventId]) return _notebookDataCache[eventId];
    const [content, presentation] = await Promise.all([
      loadJSON(`json/notebook_content_${eventId}.json`),
      loadJSON(`json/notebook_presentation_${eventId}.json`)
    ]);
    _notebookDataCache[eventId] = { content, presentation };
    return _notebookDataCache[eventId];
  }

  async function renderNotebook(eventId, options = {}) {
    const { reviewMode = false } = options;
    const { content, presentation } = _notebookDataCache[eventId];

    const assessmentChoices = {};
    const nodes = getNotebookAssessmentNodes();
    nodes.forEach(item => {
      if (item.sceneId && item.label) assessmentChoices[item.sceneId] = item.label;
    });

    const reflectionList = selectReflections(eventId, assessmentChoices, content, presentation);

    renderNotebookLeft(content, reflectionList, eventId);
    renderNotebookRight(content);
    _mountNotebookPages();

    const advBtn = document.getElementById('notebook-advance-btn');
    const chapterNum = eventId.split('_')[1] || '1';
    advBtn.textContent = reviewMode ? '關閉筆記' : `完成第${_chapterToChinese(parseInt(chapterNum))}章，回到大地圖`;
    advBtn.classList.add('hidden');
    advBtn.onclick = reviewMode ? _exitNotebookReview : exitNotebook;

    if (!state.tts_on || reviewMode) {
      advBtn.classList.remove('hidden');
    } else {
      await playNotebookTTS(eventId, reflectionList, presentation);
      if (!document.getElementById('notebook-house')?.classList.contains('hidden')) {
        advBtn.classList.remove('hidden');
      }
    }
  }




  function getNotebookAssessmentNodes() {
    if (Array.isArray(state.assessment_nodes) && state.assessment_nodes.length) {
      return state.assessment_nodes;
    }

    try {
      const progress = JSON.parse(localStorage.getItem('la_progress') || '{}');
      if (Array.isArray(progress.assessment_nodes) && progress.assessment_nodes.length) {
        return progress.assessment_nodes;
      }
    } catch {}

    try {
      const cached = JSON.parse(localStorage.getItem('la_assessment') || '{}');
      if (Array.isArray(cached.nodes)) return cached.nodes;
      return Object.entries(cached)
        .filter(([sceneId, data]) => sceneId && data && typeof data === 'object')
        .map(([sceneId, data]) => ({ sceneId, ...data }));
    } catch {
      return [];
    }
  }

  function selectReflections(eventId, assessmentChoices, content, presentation) {
    const DIMENSION_ORDER = [
      'value_judgment',
      'social_understanding',
      'information_integration',
      'context_understanding',
      'vocabulary'
    ];

    const reflectionData = content.notebook_assessment_reflections || {};
    const evalData = eventData.evaluation || {};
    const scenes = Array.isArray(evalData)
      ? evalData
      : (evalData.scenes || evalData.nodes || evalData.evaluation_nodes || []);

    const assessmentScenes = scenes
      .filter(s => s.collect_type === 'assessment')
      .sort((a, b) => {
        const aDimension = Array.isArray(a.dimension) ? a.dimension[0] : a.dimension;
        const bDimension = Array.isArray(b.dimension) ? b.dimension[0] : b.dimension;
        const ai = DIMENSION_ORDER.indexOf(aDimension);
        const bi = DIMENSION_ORDER.indexOf(bDimension);
        return (ai === -1 ? 99 : ai) - (bi === -1 ? 99 : bi);
      });

    const result = [];
    for (const scene of assessmentScenes) {
      if (result.length >= 3) break;
      const sceneId = scene.scene_id;
      const label = assessmentChoices[sceneId];
      if (!label) continue;
      const text = reflectionData[sceneId]?.[label];
      if (!text) continue;
      const audio = presentation?.reflections?.scenes?.[sceneId]?.[label] || null;
      result.push({ sceneId, label, text, audio });
    }
    return result;
  }

  async function playNotebookTTS(eventId, reflectionList, presentation) {
    const left = presentation.left || {};
    const right = presentation.right || {};
    const sequence = [];

    if (left.title) sequence.push({ file: left.title, elId: 'notebook-title-left' });
    if (left.section_adventure) sequence.push({ file: left.section_adventure, elId: 'notebook-section-adventure' });
    (left.story_progress || []).forEach((file, i) => {
      sequence.push({ file, elId: 'notebook-story-progress', index: i });
    });
    if (left.places) sequence.push({ file: left.places, elId: 'notebook-places' });
    if (left.people) sequence.push({ file: left.people, elId: 'notebook-people' });
    if (presentation.reflections?.title) sequence.push({ file: presentation.reflections.title, elId: 'notebook-reflection-title' });
    reflectionList.forEach((r, i) => {
      if (r.audio) sequence.push({ file: r.audio, elId: 'notebook-reflections', index: i });
    });
    if (right.title) sequence.push({ file: right.title, elId: 'notebook-title-right' });
    (right.learned_points || []).forEach((file, i) => {
      sequence.push({ file, elId: 'notebook-learned-points', index: i });
    });

    for (const item of sequence) {
      if (!state.tts_on) break;
      if (document.getElementById('notebook-house')?.classList.contains('hidden')) break;
      const container = item.elId ? document.getElementById(item.elId) : null;
      const textEl = container
        ? (item.index !== undefined ? (container.children[item.index] || container) : container)
        : null;
      await playTTS(item.file, { textElement: textEl });
      if (document.getElementById('notebook-house')?.classList.contains('hidden')) break;
    }
  }

  async function enterGame(gameId) {
    const location = _gameLocationFromId(gameId);
    if (!location) {
      logError('Unknown gameId', gameId, state.uid);
      return;
    }
    showRoom('game-house');
    handleRoomTransition('game');
    await loadGameData(location);
    if (document.getElementById('game-house')?.classList.contains('hidden')) return;
    gameState.gameId = gameData.content?.game_id || gameId;
    gameState.location = location;
    gameState.variationId = pickVariation(gameState.gameId);
    _bindGameVariation(gameState.variationId);
    renderGameScreen('intro');

  function _gameLocationFromId(gameId) {
    return GAME_LOCATION_BY_ID[gameId] || null;
  }

  function pickVariation(gameId) {
    const variations = gameData.manifest?.variations || [];
    if (!variations.length) return null;
    if (!_gamePlayedVariations[gameId]) _gamePlayedVariations[gameId] = [];
    let remaining = variations.filter(v => !_gamePlayedVariations[gameId].includes(v.variation_id));
    if (!remaining.length) {
      _gamePlayedVariations[gameId] = [];
      remaining = variations;
    }
    const chosen = remaining[Math.floor(Math.random() * remaining.length)];
    _gamePlayedVariations[gameId].push(chosen.variation_id);
    return chosen.variation_id;
  }

  function _bindGameVariation(variationId) {
    gameState.contentVariation = (gameData.content?.variations || []).find(v => v.variation_id === variationId);
    gameState.manifestVariation = (gameData.manifest?.variations || []).find(v => v.variation_id === variationId);
    gameState.evaluationVariation = (gameData.evaluation?.variations || []).find(v => v.variation_id === variationId);
    gameState.presentationVariation = (gameData.presentation?.variations || []).find(v => v.variation_id === variationId);

    gameState.selectedComboId = null;
    gameState.isCorrect = false;

  async function onGameOptionSelected(optionId) {
    document.querySelectorAll('.game-option-btn').forEach(btn => { btn.disabled = true; });
    gameState.selectedOptionId = optionId;
    gameState.isCorrect = _isCorrectOption(optionId);
    _recordGameAssessment(gameState.isCorrect, optionId);
    if ((gameData.manifest?.visual_state?.correct_trigger === 'on_correct') && gameState.isCorrect) {
      const reunion = gameState.presentationVariation?.reunion_image || gameData.presentation.character_assets?.edmund_margaret_reunion?.image;

  function _isCorrectOption(optionId) {
    const evalVar = gameState.evaluationVariation || {};
    const correct = (evalVar.options || []).find(o => o.role === 'correct' || o.role === 'odd_item');
    return correct?.option_id === optionId;
  }

  function _recordGameAssessment(isCorrect, answerId) {
    const evalVar = gameState.evaluationVariation || {};
    recordGameAttempt(gameState.gameId, gameState.variationId, {
      source: 'minigame',
      label: answerId,
      correct: isCorrect,
      dimension: evalVar.dimension,
      skill: evalVar.skill,
      vocabulary_intro_ids: gameState.contentVariation?.vocabulary_intro_ids || [],
    });
  }

  async function recordGameAttempt(gameId, variationId, data) {
    if (!db || !state.uid) return;
    try {
      const attemptId = crypto.randomUUID();
      await db.collection('users').doc(state.uid)
        .collection('game_attempts').doc(gameId)
        .collection('attempts').doc(attemptId)
        .set({
          ...data,
          attempt_id: attemptId,
          game_id: gameId,
          variation_id: variationId,
          timestamp: firebase.firestore.FieldValue.serverTimestamp()
        });
    } catch (e) {
      logError(e.message, 'recordGameAttempt', state.uid);
    }
  }

  let _mapResizeBound = false;

  function resizeMapFrame() {
    const stage = document.getElementById('map-stage');
    const frame = document.getElementById('map-image-frame');
    const bg = document.getElementById('map-bg');
    if (!stage || !frame || !bg || !bg.naturalWidth || !bg.naturalHeight) return;

    const stageW = stage.clientWidth;
    const stageH = stage.clientHeight;
    if (!stageW || !stageH) return;

    const imgRatio = bg.naturalWidth / bg.naturalHeight;
    const stageRatio = stageW / stageH;

    let w, h;
    if (stageRatio > imgRatio) {
      h = stageH;
      w = h * imgRatio;
    } else {
      w = stageW;
      h = w / imgRatio;
    }

    frame.style.width = `${w}px`;
    frame.style.height = `${h}px`;
  }

  function handleMapResize() {
    const mapHouse = document.getElementById('map-house');
    if (mapHouse && !mapHouse.classList.contains('hidden')) {
      resizeMapFrame();
    }
  }

  function bindMapResize() {
    if (_mapResizeBound) return;
    window.addEventListener('resize', handleMapResize);
    _mapResizeBound = true;
  }

  function unbindMapResize() {
    if (!_mapResizeBound) return;
    window.removeEventListener('resize', handleMapResize);
    _mapResizeBound = false;
  }

    resumeTTS();

        storyBtn.addEventListener('click', () => { unbindMapResize(); enterStory(_nextStoryTarget(nextChapter.chapter)); });

  function _completedChapterIds() {
    return (state.completed_events || []).map(eventId => {
      const s = String(eventId).replace(/^story_/, '');
      // 支援 '1.1' 格式（舊資料）→ 統一轉為 '1_1'
      return s.replace(/\./g, '_');
    });
  }

  function _isLocationVisible(loc, completed) {
    const appearsAfter = String(loc.appears_after_event || '').replace(/^story_/, '');
    return !appearsAfter || completed.includes(appearsAfter);
  }

  function getGameBtnState(loc, completed) {
    if (!_isLocationVisible(loc, completed)) return 'hidden';
    return 'ready';
  }

  function applyGameBtnState(btn, gameStateName, loc) {
    btn.className = 'pin-game-btn';
    switch (gameStateName) {
      case 'hidden':
        btn.classList.add('hidden');
        break;
      case 'ready':
        btn.classList.add('pin-game-ready');
        btn.textContent = _gameTitleForLocation(loc);
        btn.addEventListener('click', () => { unbindMapResize(); enterGame(loc.location_id); });
        break;
    }
  }

  function _nextStoryTarget(chapterId) {
    const currentScene = state.current_scene;
    const currentEvent = currentScene ? String(currentScene).split('_').slice(0, 2).join('_') : null;
    return currentEvent === chapterId ? currentScene : chapterId;
  }

  function _gameTitleForLocation(loc) {
    return GAME_TITLES[loc.location_id] || loc.game_name || loc.display_name || '小任務';

    const loc = globalData.map?.locations?.find(item => item.location_id === locationId);

  function _reportLevelToStars(level) {
    const count = 6 - level;
    return '★'.repeat(count) + '☆'.repeat(5 - count);
  }

  function _reportAssessmentNodes() {
    if (Array.isArray(state.assessment_nodes) && state.assessment_nodes.length) {
      return state.assessment_nodes;
    }
    try {
      const cached = JSON.parse(localStorage.getItem('la_assessment') || '{}');
      if (Array.isArray(cached.nodes)) return cached.nodes;
      return Object.entries(cached).map(([sceneId, data]) => ({ sceneId, ...data }));
    } catch {
      return [];
    }
  }

  function _calculateDimensions() {
    const nodes = _reportAssessmentNodes();
    const dims = {
      vocabulary: { score: 0, max: 0 },
      context_understanding: { score: 0, max: 0 },
      social_understanding: { score: 0, max: 0 },
      information_integration: { score: 0, max: 0 },
      value_judgment: { score: 0, max: 0 }
    };

    nodes.filter(n => n.collect_type === 'assessment').forEach(n => {
      const score = n.scoring?.[n.label] ?? 0;
      const dimensions = Array.isArray(n.dimension) ? n.dimension : [n.dimension].filter(Boolean);
      const [primary, secondary] = dimensions;
      if (primary && dims[primary] !== undefined) {
        dims[primary].score += score;
        dims[primary].max += 1;
      }
      if (secondary && dims[secondary] !== undefined) {
        dims[secondary].score += score * 0.5;
        dims[secondary].max += 0.5;
      }
    });

    const result = {};
    Object.keys(dims).forEach(key => {
      const { score, max } = dims[key];
      const pct = max > 0 ? score / max : 0;
      result[key] = pct >= 0.75 ? 1 : pct >= 0.50 ? 2 : pct >= 0.25 ? 3 : 4;
    });
    return result;
  }

  function _extractExplorationData() {
    // exploration：從 visited_sub_scenes 讀取，配合 evaluation 場景清單
    const evalScenes = Array.isArray(eventData.evaluation)
      ? eventData.evaluation
      : (eventData.evaluation?.scenes || eventData.evaluation?.nodes || eventData.evaluation?.evaluation_nodes || []);

    const explorationSceneIds = new Set(
      evalScenes
        .filter(s => s.collect_type === 'exploration' || s.collect_type === 'hidden_assessment')
        .map(s => s.scene_id)
    );

    const visitedSubs = state.visited_sub_scenes || {};
    // 注意：exp_tag/label 目前以玩家選項 label（A/B/C）為準
    // 日後若 evaluation data 補入 choice metadata，再映射為語義標籤
    const exploration = Object.entries(visitedSubs)
      .filter(([sceneId]) => explorationSceneIds.has(sceneId))
      .flatMap(([sceneId, tags]) =>
        (tags || []).map(tag => ({ scene_id: sceneId, exp_tag: tag, label: tag }))
      );

    // hiddenNodes：從 assessment_nodes 讀取
    const nodes = _reportAssessmentNodes();
    const hiddenNodes = nodes
      .filter(n => n.collect_type === 'hidden_remedial' || n.collect_type === 'hidden_assessment')
      .map(n => ({ scene_id: n.sceneId, trigger: n.trigger }));

    return { exploration, hiddenNodes };
  }




  async function _loadScript(src) {
    return new Promise((resolve, reject) => {
      if (document.querySelector(`script[src="${src}"]`)) { resolve(); return; }
      const s = document.createElement('script');
      s.src = src;
      s.onload = resolve;
      s.onerror = reject;
      document.head.appendChild(s);
    });
  }

  async function downloadReport() {
    const btn = document.getElementById('btn-download-report');
    btn.disabled = true;
    btn.textContent = '準備中…';
    try {
      await _loadScript('https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js');
      await _loadScript('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js');
      const scrollEl = document.getElementById('report-scroll');
      const actionsEl = document.getElementById('report-actions');
      const prevScrollTop = scrollEl.scrollTop;
      const prevOverflow = scrollEl.style.overflow;
      const prevHeight = scrollEl.style.height;

      let canvas;
      try {
        scrollEl.scrollTop = 0;
        scrollEl.style.overflow = 'visible';
        scrollEl.style.height = 'auto';
        if (actionsEl) actionsEl.style.visibility = 'hidden';

        canvas = await html2canvas(scrollEl, {
          scale: 2,
          useCORS: true,
          backgroundColor: '#F5F0E8'
        });
      } finally {
        scrollEl.style.overflow = prevOverflow;
        scrollEl.style.height = prevHeight;
        scrollEl.scrollTop = prevScrollTop;
        if (actionsEl) actionsEl.style.visibility = '';
      }
      const { jsPDF } = window.jspdf;
      const pdf = new jsPDF({ orientation: 'portrait', unit: 'px', format: 'a4' });
      const pageWidth = pdf.internal.pageSize.getWidth();
      const pageHeight = pdf.internal.pageSize.getHeight();
      const imgWidth = pageWidth;
      const imgHeight = (canvas.height * imgWidth) / canvas.width;
      let y = 0;
      while (y < imgHeight) {
        if (y > 0) pdf.addPage();
        pdf.addImage(canvas, 'PNG', 0, -y, imgWidth, imgHeight);
        y += pageHeight;
      }
      pdf.save('小學徒大世界_第一章報告.pdf');
    } catch (e) {
      logError('PDF download failed', 'downloadReport', getCurrentUserId());
    } finally {
      btn.disabled = false;
      btn.textContent = '下載報告';
    }
  }

    const transitionText = document.getElementById('report-transition-text');
    const body = document.getElementById('report-body');
    transition.style.display = 'flex';
    transitionText.style.animation = 'none';
    void transitionText.offsetWidth;
    transitionText.style.animation = '';
    body.classList.add('hidden');

    document.getElementById('btn-download-report').onclick = downloadReport;
    document.getElementById('btn-back-to-map').onclick = leaveReport;
  }

  async function enterReread(eventId, sceneId) {
    showRoom('reread-house');

    const backBtn = document.getElementById('reread-back-to-list-btn');

        _rereadHistory.pop();

        if (prev) renderRereadScene(prev, _rereadCurrentEventId);
      }
    };
    try {
      await loadEventData(eventId);
      _rereadCurrentEventId = eventId;
      const startScene = sceneId
        || eventData.manifest?.start_scene
        || _storyList(eventData.story)?.[0]?.scene_id
        || null;
      if (!startScene) throw new Error('start_scene not found: ' + eventId);
      _rereadHistory = [];
      renderRereadScene(startScene, eventId);
    } catch (e) {
      console.error('[enterReread] error:', e);
      logError(e?.message || 'enterReread crash', 'enterReread', state.uid);
    }
  }

  async function renderRereadScene(sceneId, eventId) {
    _rereadHistory.push(sceneId);

    const prevBtn = document.getElementById('reread-prev-btn');
    if (prevBtn) prevBtn.style.visibility = _rereadHistory.length > 1 ? 'visible' : 'hidden';

    const advBtn = document.getElementById('reread-advance-btn');
    if (advBtn) { advBtn.classList.add('hidden'); advBtn.onclick = null; }

    const scene = _findByScene(_storyList(eventData.story), sceneId);
    const manifestScene = _findByScene(_storyList(eventData.manifest), sceneId) || {};
    const presentation = _findByScene(_storyList(eventData.presentation), sceneId) || {};
    const type = manifestScene.type || 'story';

    // 更新標題
    const label = document.getElementById('reread-event-label');
    if (label) label.textContent = presentation.chapter_label || '';

    // 更新左頁圖像
    if (presentation.image) {
      const imgEl = document.getElementById('reread-image-display');
      if (imgEl) imgEl.style.backgroundImage = `url("${_storyImagePath(presentation.image)}")`;
    }

    // 清空右頁
    const textArea = document.getElementById('reread-text-area');
    const questionArea = document.getElementById('reread-question-area');
    const choicesArea = document.getElementById('reread-choices-area');
    if (textArea) textArea.innerHTML = '';
    if (questionArea) questionArea.innerHTML = '';
    if (choicesArea) choicesArea.innerHTML = '';

    if (!scene) {
      console.error('[renderRereadScene] scene not found:', sceneId);
      return;
    }

    if (type === 'event_end') {
      if (textArea && scene.lines) {
        textArea.innerHTML = scene.lines.map((l, i) => `<p data-line-index="${i}">${l.text || l}</p>`).join('');
      }
      // TTS：播完才顯示繼續（沿用故事房 playLinesSequence，lockUI不鎖重讀房）
      const audioLines = presentation?.audio?.lines || [];
      if (audioLines.length > 0 && textArea) {
        await playLinesSequence(audioLines, scene.lines, textArea, presentation);
      }
      if (advBtn) {
        advBtn.textContent = '繼續';
        advBtn.classList.remove('hidden');
        advBtn.onclick = () => backToRereadList();
      }
      return;
    }

    if (type === 'story' || type === 'feedback') {
      if (textArea && scene.lines) {
        textArea.innerHTML = scene.lines.map((l, i) => `<p data-line-index="${i}">${l.text || l}</p>`).join('');
      }
      // TTS：播完才顯示繼續（沿用故事房 playLinesSequence，lockUI不鎖重讀房）
      const audioLines = presentation?.audio?.lines || [];
      if (audioLines.length > 0 && textArea) {
        await playLinesSequence(audioLines, scene.lines, textArea, presentation);
      }
      if (advBtn) {
        advBtn.textContent = presentation.advance_label || '繼續';
        advBtn.classList.remove('hidden');
        advBtn.onclick = () => {
          const next = manifestScene.next_scene || scene.next_scene;
          if (next) renderRereadScene(next, eventId);
        };
      }
      return;
    }

    if (type === 'assessment' || type === 'assessment_remedial') {
      if (textArea && scene.lines) {
        textArea.innerHTML = scene.lines.map((l, i) => `<p data-line-index="${i}">${l.text || l}</p>`).join('');
      }
      if (questionArea && scene.question) {
        questionArea.innerHTML = `<p>${scene.question}</p>`;
      }
      // TTS：播問題音頻
      if (presentation?.audio?.question && questionArea) {
        await playLine(_audioPath(presentation.audio.question), _timestampPath(presentation.audio.question), questionArea);
      }
      if (choicesArea && scene.choices) {
        scene.choices.forEach(choice => {
          const btn = document.createElement('button');
          btn.className = 'reread-choice-btn';
          btn.textContent = choice.text || choice;
          btn.addEventListener('click', () => {
            // 重讀模式：不呼叫 recordAssessment()
            const next = choice.next_scene || manifestScene.next_scene;
            if (next) renderRereadScene(next, eventId);
          });
          choicesArea.appendChild(btn);
        });
      }
      return;
    }

    if (type === 'hidden_assessment' || type === 'hidden_remedial') {
      if (textArea && scene.lines) {
        textArea.innerHTML = scene.lines.map((l, i) => `<p data-line-index="${i}">${l.text || l}</p>`).join('');
      }
      // TTS：播完才顯示繼續
      const audioLinesH = presentation?.audio?.lines || [];
      if (audioLinesH.length > 0 && textArea) {
        await playLinesSequence(audioLinesH, scene.lines, textArea, presentation);
      }
      if (advBtn) {
        advBtn.textContent = presentation.advance_label || '繼續';
        advBtn.classList.remove('hidden');
        advBtn.onclick = () => {
          const next = manifestScene.next_scene || scene.next_scene;
          if (next) renderRereadScene(next, eventId);
        };
      }
      return;
    }

    if (type === 'explore' || type === 'free_explore') {
      if (textArea && scene.lines) {
        textArea.innerHTML = scene.lines.map((l, i) => `<p data-line-index="${i}">${l.text || l}</p>`).join('');
      }
      if (questionArea && scene.question) {
        questionArea.innerHTML = `<p>${scene.question}</p>`;
      }
      // TTS：播問題音頻
      if (presentation?.audio?.question && questionArea) {
        await playLine(_audioPath(presentation.audio.question), _timestampPath(presentation.audio.question), questionArea);
      }
      if (choicesArea && scene.choices) {
        scene.choices.forEach(choice => {
          const btn = document.createElement('button');
          btn.className = 'reread-choice-btn';
          btn.textContent = choice.text || choice;
          btn.addEventListener('click', () => {
            const next = choice.next_scene || manifestScene.next_scene;
            if (next) renderRereadScene(next, eventId);
          });
          choicesArea.appendChild(btn);
        });
      }
      return;
    }
  }

    if (ttsVol) ttsVol.classList.toggle('disabled', state.tts_on === false);

    // 分段按鈕
    _highlightSettingsSegBtn('settings-bgm-vol-btns', state.bgm_volume || 'mid');
    _highlightSettingsSegBtn('settings-sfx-vol-btns', state.sfx_volume || 'mid');
    _highlightSettingsSegBtn('settings-tts-vol-btns', state.tts_volume || 'mid');
    _highlightSettingsSegBtn('settings-speed-btns', state.speed || 'normal');
  }

  function _highlightSettingsSegBtn(containerId, activeValue) {
    const container = document.getElementById(containerId);
    if (!container) return;
    container.querySelectorAll('.seg-btn').forEach(btn => {
      btn.classList.toggle('seg-btn-active', btn.dataset.value === activeValue);
    });
  }

  function syncSettingsGlobalUI() {
    const btnBGM = document.getElementById('btn-bgm');
    if (btnBGM) btnBGM.textContent = state.bgm_on !== false ? '🎵 音樂' : '🎵 音樂✕';
    const btnTTS = document.getElementById('btn-tts');
    if (btnTTS) btnTTS.textContent = state.tts_on !== false ? '🔊 語音' : '🔊 語音✕';
    const btnSpeed = document.getElementById('btn-speed');
    if (btnSpeed) {
      const labels = { slow: '慢', normal: '正常', fast: '快' };
      btnSpeed.textContent = labels[state.speed] || '正常';
      btnSpeed.disabled = state.tts_on === false;
      btnSpeed.style.opacity = state.tts_on !== false ? '1' : '0.4';
    }
  }

  // 設置房事件綁定（在 DOM ready 後呼叫）
  function initSettingsBindings() {
    // 音樂開關
    document.getElementById('settings-bgm-toggle')?.addEventListener('click', () => {
      state.bgm_on = state.bgm_on === false ? true : false;
      setMuted('bgm', !state.bgm_on);
      renderSettingsUI();
      syncSettingsGlobalUI();
    });

    // 音效開關
    document.getElementById('settings-sfx-toggle')?.addEventListener('click', () => {
      state.sfx_on = state.sfx_on === false ? true : false;
      setMuted('sfx', !state.sfx_on);
      renderSettingsUI();
    });

    // 語音開關
    document.getElementById('settings-tts-toggle')?.addEventListener('click', () => {
      state.tts_on = state.tts_on === false ? true : false;
      if (!state.tts_on) {
        cancelTTSQueue();
        document.dispatchEvent(new Event('tts:ended'));
      } else {
        resumeTTS();
      }
      renderSettingsUI();
      syncSettingsGlobalUI();
    });

    // 音量分段按鈕（BGM）
    document.getElementById('settings-bgm-vol-btns')?.addEventListener('click', (e) => {
      const val = e.target.dataset.value;
      if (!val) return;
      state.bgm_volume = val;
      setVolume('bgm', VOLUME_MAP[val]);
      saveVolumeSettings();
      _highlightSettingsSegBtn('settings-bgm-vol-btns', val);
    });

    // 音量分段按鈕（SFX）
    document.getElementById('settings-sfx-vol-btns')?.addEventListener('click', (e) => {
      const val = e.target.dataset.value;
      if (!val) return;
      state.sfx_volume = val;
      setVolume('sfx', VOLUME_MAP[val]);
      saveVolumeSettings();
      _highlightSettingsSegBtn('settings-sfx-vol-btns', val);
    });

    // 音量分段按鈕（TTS）
    document.getElementById('settings-tts-vol-btns')?.addEventListener('click', (e) => {
      const val = e.target.dataset.value;
      if (!val) return;
      state.tts_volume = val;
      setVolume('tts', VOLUME_MAP[val]);
      saveVolumeSettings();
      _highlightSettingsSegBtn('settings-tts-vol-btns', val);
    });

    // 語速分段按鈕
    document.getElementById('settings-speed-btns')?.addEventListener('click', (e) => {
      const val = e.target.dataset.value;
      if (!val || state.tts_on === false) return;
      setSpeed(val);
      syncSettingsGlobalUI();
      _highlightSettingsSegBtn('settings-speed-btns', val);
    });
  }

  // ========== /系統設置房 ==========

  // ========== 啟動 ==========
  (async function init() {
    await loadGlobalData();
    initGlobalUI();
    initProgressPanelDevEntry();
    await initAudioManager();
    loadVolumeSettings();
    initOpeningHouse();
    initSettingsBindings();
  })();

  // DOM + App lifecycle bindings
  // 所有函數（state / showRoom / enterMap / openProgressPanel / cancelTTSQueue）此時均已定義

  if (auth) auth.onAuthStateChanged(async (user) => {
    if (user) {
      state.uid = user.uid;
      document.getElementById('btn-account').textContent = user.displayName || user.email;
      await initProgress(user.uid);
    } else {
      state.uid = null;
      document.getElementById('btn-account').textContent = '登入';
    }
    if (document.getElementById('opening-buttons')) _renderOpeningButtons();
  });

  document.getElementById('btn-account').addEventListener('click', () => {
    if (!auth) { console.warn('[Dev] Firebase未初始化'); return; }
    if (state.uid) {
      auth.signOut();
    } else {
      const provider = new firebase.auth.GoogleAuthProvider();
      auth.signInWithPopup(provider).catch(e => logError(e.message, 'signInWithPopup', null));
    }
  });

  document.getElementById('btn-catalogue-nav')?.addEventListener('click', () => {
    cancelTTSQueue();
    showRoom('catalogue-house');
    if (typeof enterCatalogue === 'function') enterCatalogue();
  });

  document.getElementById('btn-back-to-map-nav')?.addEventListener('click', () => {
    cancelTTSQueue();
    handleRoomTransition('room-map');
    showRoom('map-house');
    if (typeof enterMap === 'function') enterMap();
  });

  </script>
</body>
</html>
